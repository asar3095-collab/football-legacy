<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Football Legacy — Карьера</title>
<style>
:root{--bg:#07101d;--panel:#0d1b2d;--panel2:#11243a;--line:#24405d;--text:#f4f7fb;--muted:#91a5bc;--green:#29d17b;--gold:#ffd166;--red:#ff6262;--blue:#55a8ff}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 15% 0,#123354 0,#07101d 42%);color:var(--text)}
button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 15px;background:var(--green);color:#04120b;font-weight:800;transition:.15s}button:hover{transform:translateY(-1px);filter:brightness(1.05)}button.secondary{background:#1a3049;color:#fff}button.gold{background:var(--gold);color:#241b00}button.danger{background:#c9434f;color:#fff}
.wrap{max-width:1200px;margin:auto;padding:20px}.hero{padding:25px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(135deg,#102b47,#0b1728);box-shadow:0 18px 50px #0005;margin-bottom:16px}
h1{margin:0 0 7px;font-size:34px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.grid2{display:grid;grid-template-columns:1.3fr .7fr;gap:14px}.card{background:linear-gradient(145deg,var(--panel),#0a1727);border:1px solid var(--line);border-radius:17px;padding:16px}.actions{display:flex;gap:9px;flex-wrap:wrap}.stat{font-size:25px;font-weight:900}.small{font-size:13px}.tag{display:inline-block;background:#1a3049;border:1px solid #2b4967;padding:4px 8px;border-radius:99px;margin:2px;font-size:12px}.hidden{display:none}
input,select{width:100%;padding:11px;border-radius:10px;border:1px solid #35506c;background:#091625;color:#fff;margin-top:6px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.tabs button.active{background:var(--green);color:#06120b}.bar{height:9px;background:#162b42;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}
.row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #20364e;padding:10px 0}.row:last-child{border-bottom:0}.log{max-height:290px;overflow:auto}.notice{padding:11px;border-radius:12px;background:#10263d;border:1px solid #23415e;margin-top:10px}.positive{color:var(--green)}.goldtxt{color:var(--gold)}.redtxt{color:var(--red)}.bluetxt{color:var(--blue)}
.pitch{height:210px;border-radius:16px;background:repeating-linear-gradient(0deg,#17633f 0,#17633f 35px,#1c7048 35px,#1c7048 70px);border:3px solid #d8eee0;position:relative;overflow:hidden;margin-bottom:12px}.pitch:after{content:"";position:absolute;left:10%;right:10%;top:20%;bottom:20%;border:2px solid #d8eee0aa}.ball{position:absolute;font-size:34px;transition:all .5s}
.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:9px;border-bottom:1px solid #20364e}.table th{color:var(--muted);font-size:12px}.score{font-size:34px;font-weight:950}.event{padding:10px;border-left:3px solid var(--green);background:#0d2135;margin:7px 0;border-radius:0 10px 10px 0}
@media(max-width:760px){.grid2{grid-template-columns:1fr}h1{font-size:27px}.wrap{padding:12px}}
</style>
</head>
<body>
<div class="wrap">
<section id="home" class="hero">
<h1>⚽ Football Legacy</h1>
<p class="muted">Карьера футболиста или тренера • клубы • турниры • сборные • контракты • развитие • новости</p>
<div class="actions"><button onclick="newCareer()">Новая карьера</button><button class="secondary" onclick="loadCareer()">Продолжить</button><button class="secondary" onclick="demo()">Демо-карьера</button></div>
</section>

<section id="create" class="card hidden">
<h2>Новая карьера</h2>
<div class="grid">
<div><label>Роль<select id="role"><option value="player">⚽ Футболист</option><option value="coach">🧑‍💼 Тренер</option></select></label></div>
<div><label>Имя<input id="name" placeholder="Алекс"></label></div><div><label>Фамилия<input id="surname" placeholder="Мартинес"></label></div>
<div><label>Стартовый клуб<select id="club"><option>Northbridge FC</option><option>London Lions</option><option>Madrid Stars</option><option>Munich 04</option><option>Paris United</option><option>Milan Athletic</option><option>Barcelona City</option><option>Manchester Royals</option></select></label></div>
<div><label>Национальность<select id="nation"><option>Англия</option><option>Испания</option><option>Франция</option><option>Германия</option><option>Италия</option><option>Бразилия</option><option>Аргентина</option><option>Португалия</option></select></label></div>
</div><br><button onclick="start()">Начать карьеру</button>
</section>

<section id="game" class="hidden">
<div class="hero"><div class="actions" style="justify-content:space-between"><div><h1 id="title"></h1><div id="subtitle" class="muted"></div></div><div class="actions"><button class="secondary" onclick="showTab('career')">📊 Карьера</button><button class="secondary" onclick="saveCareer()">💾 Сохранить</button></div></div></div>
<div class="grid">
<div class="card"><div class="muted">Возраст</div><div class="stat" id="age"></div></div><div class="card"><div class="muted">Сезон</div><div class="stat" id="season"></div></div>
<div class="card"><div class="muted">Клуб</div><div class="stat" id="clubOut"></div></div><div class="card"><div class="muted">Рейтинг</div><div class="stat" id="rating"></div></div>
<div class="card"><div class="muted">Форма</div><div class="stat" id="formOut"></div></div><div class="card"><div class="muted">Трансферная цена</div><div class="stat" id="valueOut"></div></div>
</div>
<div class="tabs"><button id="tMatch" onclick="showTab('match')">⚽ Матч</button><button onclick="showTab('team')">👥 Команда</button><button onclick="showTab('tournaments')">🏆 Турниры</button><button onclick="showTab('national')">🌍 Сборная</button><button onclick="showTab('news')">📰 Новости</button><button onclick="showTab('career')">📈 Развитие</button></div>
<div id="panel"></div>
<div class="card" style="margin-top:14px"><h3>История</h3><div id="log" class="log"></div></div>
</section>
</div>

<script>
let s=null, tab="match";
const clubs=["Northbridge FC","London Lions","Madrid Stars","Munich 04","Paris United","Milan Athletic","Barcelona City","Manchester Royals"];
const nations=["Англия","Испания","Франция","Германия","Италия","Бразилия","Аргентина","Португалия"];
const formations=["4-3-3","4-2-3-1","4-4-2","3-5-2","5-3-2"];
const positions=["Вратарь","Защитник","Полузащитник","Нападающий"];
const first=["Иван","Алекс","Лео","Матео","Лукас","Даниэль","Марк","Эрик","Томас","Нико","Антон","Мартин"];
const last=["Мартинес","Силва","Ривера","Коста","Новак","Ромеро","Фернандес","Кинг","Вебер","Морено"];
function $(id){return document.getElementById(id)}
function show(id){["home","create","game"].forEach(x=>$(x).classList.add("hidden"));$(id).classList.remove("hidden")}
function newCareer(){show("create")}
function money(n){return "€"+Math.round(n/1000000*10)/10+"M"}
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function mkPlayers(){
 let arr=[]; for(let i=0;i<18;i++) arr.push({name:pick(first)+" "+pick(last),pos:pick(positions),rating:rand(62,86),age:rand(18,33),morale:rand(65,92)});
 return arr;
}
function start(){
 let role=$("role").value,n=$("name").value.trim()||"Алекс",sn=$("surname").value.trim()||"Мартинес";
 s={version:2,name:n,surname:sn,role,club:$("club").value,nation:$("nation").value,season:1,age:role==="player"?16:32,matches:0,goals:0,assists:0,trophies:0,rating:role==="player"?60:68,form:75,morale:80,fitness:90,training:0,injury:0,contractYears:3,salary:role==="player"?120000:1800000,value:role==="player"?500000:7000000,position:"Полузащитник",formation:"4-3-3",players:mkPlayers(),leaguePts:0,leaguePos:rand(5,12),cup:false,cl:false,worldCup:0,nationalCaps:0,nationalGoals:0,news:[],log:[],stats:{league:0,cup:0,cl:0},settings:{autosave:true}};
 add("Начало новой карьеры в "+s.club+".");
 if(role==="player") add("Академия: впереди первый просмотр и профессиональный контракт.");
 else add("Первый сезон тренера: нужно построить команду и добиться результата.");
 show("game");render();
}
function demo(){newCareer();$("name").value="Алекс";$("surname").value="Мартинес";start()}
function add(t){s.log.unshift("Сезон "+s.season+": "+t);s.log=s.log.slice(0,45)}
function news(t,type="event"){s.news.unshift({t,season:s.season,type});s.news=s.news.slice(0,20)}
function saveCareer(){if(!s)return;localStorage.setItem("footballLegacyV2",JSON.stringify(s));alert("Карьера сохранена.")}
function loadCareer(){let x=null;try{x=JSON.parse(localStorage.getItem("footballLegacyV2"))}catch(e){} if(x&&x.version===2){s=x;show("game");render()}else alert("Сохранения V2 пока нет.")}
function render(){
 $("title").textContent=s.name+" "+s.surname;$("subtitle").textContent=(s.role==="player"?"Футболист":"Тренер")+" • "+s.club+" • "+s.nation;
 $("age").textContent=s.age;$("season").textContent=s.season+" / 40";$("clubOut").textContent=s.club;$("rating").textContent=s.rating;
 $("formOut").textContent=s.form+"%";$("valueOut").textContent=money(s.value);
 $("log").innerHTML=s.log.map(x=>"<div class='row'><span>"+x+"</span></div>").join("");
 renderPanel();
 if(s.settings?.autosave) try{localStorage.setItem("footballLegacyV2",JSON.stringify(s))}catch(e){}
}
function showTab(x){tab=x;render()}
function renderPanel(){
 let h="";
 if(tab==="match") h=matchPanel();
 if(tab==="team") h=teamPanel();
 if(tab==="tournaments") h=tournamentPanel();
 if(tab==="national") h=nationalPanel();
 if(tab==="news") h=newsPanel();
 if(tab==="career") h=careerPanel();
 $("panel").innerHTML=h;
}
function matchPanel(){
 return `<div class="grid2"><div class="card"><h2>🏟️ Матч</h2><div class="pitch"><span class="ball" style="left:48%;top:65%">⚽</span></div>
 <div class="grid"><div><b>Схема</b><select id="formation">${formations.map(x=>`<option ${x===s.formation?"selected":""}>${x}</option>`).join("")}</select></div>
 <div><b>Тактика</b><select id="tactic"><option>Атакующая</option><option>Сбалансированная</option><option>Оборонительная</option><option>Контратаки</option><option>Прессинг</option></select></div></div><br>
 <div class="actions"><button onclick="playMatch('safe')">🧠 Осторожно</button><button onclick="playMatch('normal')">⚽ Сбалансированно</button><button class="gold" onclick="playMatch('risk')">🔥 Рискнуть</button></div></div>
 <div class="card"><h3>Состояние</h3><div>Форма <b>${s.form}%</b></div><div class="bar"><i style="width:${s.form}%"></i></div><br><div>Фитнес <b>${s.fitness}%</b></div><div class="bar"><i style="width:${s.fitness}%"></i></div><br><div>Отношения с клубом <b>${s.morale}%</b></div><div class="bar"><i style="width:${s.morale}%"></i></div><div class="notice">${s.injury>0?"❤️ Травма: "+s.injury+" матч(ей) вне игры.":"✅ Без травмы"}</div></div></div>
 <div class="card" style="margin-top:14px"><h3>💼 Контракт</h3><div class="grid"><div>Зарплата<br><b>${money(s.salary)}/год</b></div><div>Срок<br><b>${s.contractYears} лет</b></div><div>Стоимость<br><b>${money(s.value)}</b></div></div><br><button class="secondary" onclick="negotiate()">Переговоры о контракте</button> <button class="secondary" onclick="transfer()">🔄 Трансфер</button></div>`;
}
function playMatch(mode){
 s.formation=$("formation").value;
 if(s.injury>0){s.injury--;add("Пропущен матч из-за травмы.");s.form=clamp(s.form-2,0,100);render();return}
 let tactic=$("tactic").value, bonus=tactic==="Атакующая"||tactic==="Прессинг"?2:tactic==="Оборонительная"?-1:0;
 let chance=.52+(s.rating-70)*.012+(s.form-70)*.004+bonus*.015+(mode==="risk"?.10:mode==="safe"?-.08:0);
 if(s.role==="coach") chance+=.03;
 let win=Math.random()<clamp(chance,.18,.82), draw=!win&&Math.random()<.28;
 let gf=win?rand(1,4):draw?rand(0,2):rand(0,1),ga=win?rand(0,2):draw?gf:rand(1,4);
 s.matches++;s.stats.league++;s.leaguePts+=win?3:draw?1:0;s.leaguePos=clamp(s.leaguePos+(win?-1:1),1,20);
 if(s.role==="player"){let g=rand(0,2),a=rand(0,2);if(gf===0)g=0;s.goals+=g;s.assists+=a;add((win?"Победа":"Матч")+` ${gf}:${ga}. ${g} гол., ${a} ассист.`)}
 else add((win?"Победа":"Матч")+` ${gf}:${ga}. Команда заработала ${win?3:draw?1:0} очк.`);
 s.form=clamp(s.form+(win?rand(1,4):rand(-3,1)),30,100);s.fitness=clamp(s.fitness-rand(4,9),25,100);s.morale=clamp(s.morale+(win?3:-3),20,100);
 s.rating=clamp(s.rating+(win?1:0),40,99);s.value=Math.round(s.value*(1+(win?.025:-.008)));
 if(Math.random()<.07){s.injury=rand(1,4);add("❤️ Получена травма. Медицинский штаб назначил восстановление.");news(s.name+" получил травму.","injury")}
 if(Math.random()<.18){news((win?"Победа":"Неудачный результат")+" "+s.club+": "+gf+":"+ga); }
 render();
}
function train(){
 if(s.fitness<35){alert("Слишком низкий фитнес для интенсивной тренировки.");return}
 s.training++;s.rating=clamp(s.rating+1,40,99);s.form=clamp(s.form+rand(1,4),0,100);s.fitness=clamp(s.fitness-rand(5,10),0,100);
 if(s.role==="player"){let k=pick(["Скорость","Удары","Пасы","Дриблинг","Защита"]);add("Тренировка: улучшен навык «"+k+"». Рейтинг +1.");}else add("Тренировка команды: сыгранность и форма улучшены.");
 render();
}
function teamPanel(){
 let avg=Math.round(s.players.reduce((a,p)=>a+p.rating,0)/s.players.length);
 return `<div class="card"><h2>👥 Состав ${s.club}</h2><p class="muted">Средний рейтинг: ${avg} • Схема: ${s.formation}</p><table class="table"><tr><th>Игрок</th><th>Позиция</th><th>Возраст</th><th>Рейтинг</th><th>Мораль</th></tr>${s.players.map(p=>`<tr><td>${p.name}</td><td>${p.pos}</td><td>${p.age}</td><td><b>${p.rating}</b></td><td>${p.morale}%</td></tr>`).join("")}</table><br><button onclick="scout()">🔎 Скаутинг</button> <button class="secondary" onclick="changeFormation()">Изменить схему</button></div>`;
}
function scout(){let p={name:pick(first)+" "+pick(last),pos:pick(positions),rating:rand(68,88),age:rand(17,24),morale:80};s.players.push(p);add("Скаут нашёл перспективного игрока "+p.name+" ("+p.rating+").");news("Скаутский отдел сообщил о новом таланте: "+p.name);render()}
function changeFormation(){s.formation=pick(formations);add("Тактическая схема изменена на "+s.formation+".");render()}
function tournamentPanel(){
 let champion=s.trophies;
 return `<div class="grid"><div class="card"><h3>🏆 Национальный чемпионат</h3><div class="score">${s.leaguePts} очк.</div><p>Позиция: ${s.leaguePos}-я</p><button onclick="cupMatch()">Играть тур чемпионата</button></div>
 <div class="card"><h3>🥇 Кубок страны</h3><p>${s.cup?"Трофей уже выигран в этом сохранении.":"Команда участвует в кубковой сетке."}</p><button onclick="cupMatch()">Кубковый матч</button></div>
 <div class="card"><h3>⭐ Лига чемпионов</h3><p>${s.cl?"Победа в ЛЧ зафиксирована.":"Групповой этап / плей-офф."}</p><button onclick="clMatch()">Играть матч ЛЧ</button></div></div>
 <div class="card" style="margin-top:12px"><h3>🏅 Трофеи</h3><div class="stat">${champion}</div><p class="muted">Всего трофеев за карьеру</p></div>`;
}
function cupMatch(){
 let w=Math.random()>.43;s.stats.cup++;if(w){s.cup=true;s.trophies++;s.rating=clamp(s.rating+2,40,99);add("🏆 Победа в кубковом матче!");news(s.club+" прошёл дальше в кубке.")}else add("Кубковый матч завершён поражением.");render()
}
function clMatch(){
 let w=Math.random()>.48;s.stats.cl++;if(w){s.rating=clamp(s.rating+2,40,99);if(Math.random()>.72){s.cl=true;s.trophies++;add("⭐ "+s.club+" выиграл Лигу чемпионов!");news("ТРИУМФ: "+s.club+" стал победителем Лиги чемпионов.","major")}else add("⭐ Победа в Лиге чемпионов!")}else add("⭐ Матч Лиги чемпионов проигран.");render()
}
function nationalPanel(){
 let eligible=s.age>=17;
 return `<div class="card"><h2>🌍 Сборная ${s.nation}</h2><p>Статус: ${eligible?"кандидат / игрок сборной":"ещё слишком рано для взрослой сборной"}</p><div class="grid"><div>Матчи сборной<br><b>${s.nationalCaps}</b></div><div>Голы<br><b>${s.nationalGoals}</b></div><div>Чемпионаты мира<br><b>${s.worldCup}</b></div></div><br><div class="actions"><button onclick="nationalMatch()" ${eligible?"":"disabled"}>🌍 Матч сборной</button><button class="gold" onclick="worldCup()" ${eligible?"":"disabled"}>🏆 Чемпионат мира</button></div></div>`;
}
function nationalMatch(){s.nationalCaps++;let w=Math.random()>.4;if(s.role==="player"&&Math.random()>.55)s.nationalGoals++;add("Сборная "+s.nation+": "+(w?"победа":"матч завершён")+".");render()}
function worldCup(){s.worldCup++;let w=Math.random()>.65;if(w){s.trophies++;add("🏆 Чемпионат мира выигран!");news(s.nation+" стал чемпионом мира!","major")}else add("🌍 Чемпионат мира: команда выбыла из турнира.");render()}
function newsPanel(){return `<div class="card"><h2>📰 Новости</h2>${s.news.length?s.news.map(n=>`<div class="event"><b>${n.season} сезон</b> — ${n.t}</div>`).join(""):"Пока новостей нет."}</div>`}
function careerPanel(){
 return `<div class="grid"><div class="card"><h3>📈 Развитие</h3><div class="stat">${s.rating}</div><p>Рейтинг</p><button onclick="train()">💪 Тренировка</button></div><div class="card"><h3>💼 Финансы</h3><div class="stat">${money(s.salary)}</div><p>Зарплата / год</p><p>Стоимость: <b>${money(s.value)}</b></p><button onclick="negotiate()">Контракт</button></div>
 <div class="card"><h3>📊 Статистика</h3><p>Матчи: <b>${s.matches}</b></p><p>Голы: <b>${s.goals}</b> • Ассисты: <b>${s.assists}</b></p><p>Трофеи: <b>${s.trophies}</b></p></div><div class="card"><h3>🧠 Отношения</h3><p>Клуб: <b>${s.morale}%</b></p><p>Форма: <b>${s.form}%</b></p><p>Фитнес: <b>${s.fitness}%</b></p></div></div>
 <div class="card" style="margin-top:12px"><h3>⏭️ Следующий сезон</h3><p class="muted">Сезон завершится, возраст увеличится, контракты и турниры обновятся.</p><button onclick="nextSeason()">Начать следующий сезон</button></div>`;
}
function negotiate(){
 let raise=1+Math.random()*.35;s.salary=Math.round(s.salary*raise);s.contractYears=rand(2,5);s.value=Math.round(s.value*1.05);s.morale=clamp(s.morale+5,0,100);add("Новый контракт: зарплата "+money(s.salary)+" в год, срок "+s.contractYears+" года.");news("Контракт "+s.name+" продлён на "+s.contractYears+" года.");render()
}
function transfer(){
 let pool=clubs.filter(c=>c!==s.club),c=pick(pool),offer=Math.round(s.value*(.8+Math.random()*.8));
 if(confirm("Предложение от "+c+" на "+money(offer)+". Перейти?")){s.club=c;s.value=Math.round(offer);s.contractYears=rand(2,5);s.salary=Math.round(s.salary*(1.05+Math.random()*.35));s.morale=clamp(s.morale+4,0,100);add("🔄 Трансфер в "+c+" за "+money(offer)+".");news("Большой трансфер: "+s.name+" переходит в "+c+".","major");render()}
}
function nextSeason(){
 if(s.age>=40){finishCareer();return}
 s.season++;s.age++;s.cup=false;s.cl=false;s.leaguePts=0;s.leaguePos=rand(2,14);s.fitness=clamp(s.fitness+25,0,100);s.form=clamp(s.form+rand(-4,8),40,100);
 if(s.contractYears>0)s.contractYears--;else{s.salary=Math.round(s.salary*.9);add("Контракт закончился — клуб предлагает временные условия.");}
 if(Math.random()<.2) transferEvent();
 if(s.age>=18&&s.role==="player"&&s.rating>=75&&Math.random()<.25){s.value=Math.round(s.value*1.12);news("Интерес к игроку растёт после сильного сезона.")}
 if(s.age===40)add("Последний сезон карьеры.");
 add("Новый сезон начался.");render()
}
function transferEvent(){let c=pick(clubs.filter(x=>x!==s.club));news("Трансферные слухи: "+c+" следит за карьерой "+s.name+".");}
function finishCareer(){if(!confirm("Завершить карьеру сейчас?"))return;alert("🏟️ Карьера завершена! "+s.name+" "+s.surname+" • Матчи: "+s.matches+" • Голы: "+s.goals+" • Ассисты: "+s.assists+" • Трофеи: "+s.trophies);localStorage.removeItem("footballLegacyV2");s=null;show("home")}
</script>
